<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hukoom - Home Services</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #0a192f;
        color: white;
      }

      /* NAVBAR */
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 60px;
        background: #071426;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
        color: #64ffda;
      }

      .nav-links {
        list-style: none;
        display: flex;
        gap: 30px;
      }

      .nav-links a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: #64ffda;
      }

      /* HERO SECTION */
      .hero {
        height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      .hero-content h1 {
        font-size: 52px;
        margin-bottom: 20px;
        color: #64ffda;
      }

      .hero-content p {
        font-size: 20px;
        max-width: 700px;
        margin: auto;
        line-height: 1.6;
        color: #ccd6f6;
      }

      .hero-content button {
        margin-top: 30px;
        padding: 14px 30px;
        border: none;
        background: #64ffda;
        color: #0a192f;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }

      .hero-content button:hover {
        background: white;
      }

      /* FOOTER */
      footer {
        text-align: center;
        padding: 20px;
        background: #071426;
        color: #8892b0;
      }
    </style>
  </head>

  <body>
    <!-- NAVIGATION -->
    <nav>
      <div class="logo">Hukoom</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-content">
        <h1>Trusted Services, One Tap Away</h1>
        <p>
          Hukoom connects you with verified nearby professionals — plumbers,
          mechanics, cleaners, electricians and more. Fast, reliable and
          affordable home services at your convenience.
        </p>
        <a href="services.html"><button>Explore Services</button></a>
      </div>
    </section>

    <!-- FOOTER -->
    <footer>© 2026 Hukoom. All rights reserved.</footer>
  </body>
</html>
